# ARCANA — TEK DOSYALIK BİLEŞEN TESTİ
# Kopya: plugins/Arcana/skills/all-components-test.yml (başındaki _ kaldırılmalı)
# enabled: true yap; /arcana skills reload
# Başlat: /arcana skills cast all_components_test
# Durdur: /arcana skills reload
# pace.default saniyedir; varsayılan toplam süre yaklaşık 65 saniyedir.
# Oyuncu yetkisi: arcana.command.skills. Tahta kılıç tut, doğu (+X) yönünde 3 blok öteye zırh askısı koy.
# Doğrudan hasar 1 ve kısa ateş; patlama gücü 0; yıldırım yalnızca görseldir. Test dünyasında çalıştır.
# Dünya değiştiren iki adım ve teleport varsayılan kapalıdır; ATLANDI yazar.
# Bunları denemek için ilgili allow_*.default değerini true yapıp reload et.
# Teleport öncesi teleport_x/y/z.default alanlarına güvenli test koordinatlarını yaz.
# Dünya düzenleme testi testi başlattığın konuma +3x,+1y ofsetinde CAM KOYAR/KIRAR.
# Bu noktayı önceden boşalt ve iki blok adımı boyunca hareket etme; mevcut değerler otomatik geri yüklenmez.
# EŞLEŞMEDİ koşulun şu an yanlış olmasıdır, koşul motorunun bozuk olması değildir.
# UYGULANDI mekanik çağrısının sonucudur; mermi isabeti gibi gecikmeli sonuçları da gözle.
# ESKİ YAML adaptörleri aynı işlevlerin eski biçimleridir; bu dosya 57 yeni mekaniği kapsar.
#
# OLAY MODU — aynı dosyayla 23 gerçek trigger'ı TEK TEK kontrol et:
# 1) parameters.event_mode.default: true
# 2) triggers: [right_click] (her denemede yalnızca seçtiğin trigger)
# 3) parameters.event_label.default: right_click (seçtiğin trigger ile aynı etiket)
# 4) /arcana skills reload; aşağıdaki gerçek olayı oluştur.
# 16 blok içindeki arcana.command.skills yetkili en yakın oyuncu [GERÇEK OLAY] görür.
# Bu mod 57 efektlik testi yeniden başlatmaz. event_label otomatik olay adı değildir;
# yalnızca tek seçili trigger bulunduğu için hangi kaydı gözlediğin açıktır.
# Join/death vb. gerçek olaylar YAML içinden otomatik üretilemez.
# custom/timer için API çağrısı gerekir; olmayan olay için BAŞARILI mesajı basılmaz.
# join: Sunucuya yeniden gir.
# respawn: Öldükten sonra yeniden doğ.
# death: Test dünyasında öl; envanter kaybı sunucu kurallarına bağlıdır.
# block_break: Bir deneme bloğunu kır.
# block_place: Bir deneme bloğu yerleştir.
# melee_attack: Bir test canlısına yakın dövüş saldırısı yap.
# projectile_hit: Oyuncunun attığı ok bir canlıya veya bloğa çarpsın.
# damage_taken: Oyuncu normal oyun hasarı alsın.
# right_click: Ana elle kullanılabilir bir eşyaya/bloka sağ tıkla; iptal edilmiş etkileşim sayılmaz.
# left_click: Ana elle sol tıkla; iptal edilmiş etkileşim sayılmaz.
# sneak: Eğilmeye başla.
# sprint: Koşmaya başla.
# move: Konumunu değiştir; yalnızca bakış dönüşü ve teleport sayılmaz.
# jump: Zıpla.
# held_slot: Seçili hızlı erişim yuvasını değiştir.
# equip: Zırhını veya elindeki ekipmanı değiştir.
# consume: Yemek veya içecek tüket.
# shoot: Yay ile atış yap.
# kill: Bir canlıyı öldür.
# entity_attack: Oyuncu olmayan bir canlı yakın dövüş saldırısı yapsın; yakınında yetkili test oyuncusu bulunsun.
# entity_damaged: Oyuncu olmayan bir canlı normal oyun hasarı alsın; yakınında yetkili test oyuncusu bulunsun.
# custom: API gerekir: platform.trigger(SkillKey("arcana", "custom"), invocation). YAML tek başına olay üretmez.
# timer: API gerekir: platform.subscribeTimer(owner, SkillKey("arcana", "timer"), actor, 20); dönen kaydı test sonunda kapat.
# Normal teste dönüş: event_mode.default: false ve triggers: [] yapıp reload et.
# cast testinin phase parametresini 0 bırak; phase=1 yalnızca döngüsüz alt çağrı içindir.

schema: 2
id: "all_components_test"
enabled: false
triggers: []
parameters:
  phase:
    type: "number"
    default: 0
  pace:
    type: "number"
    default: 0.75
  event_mode:
    type: "boolean"
    default: false
  event_label:
    type: "text"
    default: "right_click"
  allow_world_edits:
    type: "boolean"
    default: false
  allow_teleport:
    type: "boolean"
    default: false
  teleport_x:
    type: "number"
    default: 0
  teleport_y:
    type: "number"
    default: 80
  teleport_z:
    type: "number"
    default: 0
bindings:
  var_lab_ok:
    scope: "invocation"
    key: "lab_ok"
    type: "boolean"
    default: false
  var_lab_passed:
    scope: "invocation"
    key: "lab_passed"
    type: "number"
    default: 0
  var_lab_value:
    scope: "invocation"
    key: "lab_value"
    type: "number"
    default: 0
effects:
  - type: "branch"
    condition:
      type: "variable"
      binding: "param.phase"
      equals: 1
    then:
      - type: "message"
        target: "actor"
        text: "<green>cast: aynı dosyanın phase=1 alt çağrısı tamamlandı; döngü kurulmadı.</green>"
    else:
      - type: "branch"
        condition:
          type: "variable"
          binding: "param.event_mode"
          equals: true
        then:
          - type: "message"
            target: "target"
            targeter:
              type: "players_in_radius"
              radius: 16
              limit: 1
              sort: "nearest"
              exclude-self: false
              conditions:
                - type: "permission"
                  subject: "target"
                  permission: "arcana.command.skills"
            text: "<aqua>[GERÇEK OLAY] {param.event_label} | kaynak={actor} | gözlemci={target} | hasar={data.damage}</aqua>"
            on-failure: "skip"
        else:
          - type: "sequence"
            conditions:
              - type: "actor_type"
                kind: "player"
              - type: "permission"
                permission: "arcana.command.skills"
            effects:
              - type: "set_variable"
                scope: "invocation"
                key: "lab_passed"
