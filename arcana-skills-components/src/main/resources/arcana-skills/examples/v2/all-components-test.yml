              - type: "message"
                target: "actor"
                text: "<gray>UYGULANDI = çağrı başarılı. Kalıcı oyun etkisi/isabet ayrıca gözlenmeli. ATLANDI = koşul, hedef veya çalışma hatası; zincir devam eder.</gray>"
              - type: "message"
                target: "actor"
                text: "<yellow>[DENENİYOR] 01/57 message</yellow>"
              - type: "set_variable"
                scope: "invocation"
                key: "lab_ok"
                value: false
              - type: "sequence"
