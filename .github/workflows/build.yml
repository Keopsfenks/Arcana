name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/src/main/resources/**'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'
  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/src/main/resources/**'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --full-stacktrace
      - name: Upload Arcana plugin
        uses: actions/upload-artifact@v4
        with:
          name: Arcana
          path: build/libs/arcana-*-all.jar
          if-no-files-found: error
